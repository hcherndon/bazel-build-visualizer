name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No setup-java: rules_java fetches the remote JDK 25 toolchain, and
      # the runners preinstall bazelisk, which reads .bazelversion. The
      # jpackage flow is the one step that needs a local JDK, and it is
      # deliberately not a CI step — packaging runs on a developer machine.
      - name: Cache Bazel repository cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'maven_install.json') }}
          restore-keys: |
            bazel-repo-${{ runner.os }}-
      - name: Build and test
        # --config=ci excludes the real-bazel and bazel-sweep tags VISIBLY
        # (.bazelrc test:ci): the real-bazel suites depend on host state
        # Bazel cannot fingerprint, and the four-version sweep is never run
        # by automation. This exclusion being a named config is the point —
        # a silent environment-shaped skip is the failure mode BazelBinary
        # exists to prevent.
        run: bazelisk test //... --config=ci
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-${{ matrix.os }}
          path: bazel-testlogs/**
          if-no-files-found: ignore
