# macOS file association for the portable session archive (plan 24, Phase 9).
#
# jpackage turns this into a CFBundleDocumentTypes entry, which is what makes
# Finder show the application in "Open With" and hand the path to the running
# app through Desktop.Action.APP_OPEN_FILE. Without the handler installed --
# see DesktopIntegration -- the association launches the app and it shows an
# empty window, which looks exactly like the association not working.
#
# Only .bviz is claimed. A .bep or .json file belongs to whatever the user
# already opens those with, and an application that took ownership of .json on
# install would be a bad neighbour.
extension=bviz
mime-type=application/vnd.holtherndon.bazelviz+zip
description=Bazel Build Visualizer session
