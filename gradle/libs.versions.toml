# Central dependency versions. Every third-party addition needs the review
# described in the agent execution contract (docs/adr, license, maintenance,
# performance justification) and must keep dependency locking green.
#
# Query-card editor stack (user-approved 2026-08-24, ui-swing only):
# - com.fifesoft:rsyntaxtextarea — BSD-3-Clause. SQL syntax highlighting for
#   the Query card's editor. Maintained by bobbylight (fifesoft) since 2003,
#   releases through 2025; the de facto standard Swing code editor (used by
#   jd-gui, DBeaver's predecessors, many others). Pure Swing, no native code,
#   no transitive dependencies; token-based incremental highlighting keeps
#   keystroke latency flat on multi-hundred-line SQL. Pinned to 3.6.1 — the
#   exact version autocomplete 3.3.3 declares — rather than the 4.x line,
#   because the author ships the pair together and 4.0 is a fresh major.
# - com.fifesoft:autocomplete — BSD-3-Clause, same author/cadence as
#   rsyntaxtextarea and released in lockstep with it. Schema-aware completion
#   (tables, columns, saved views) in the same editor; completions come from
#   an in-memory provider this codebase fills from SchemaTable, so no I/O on
#   the EDT is possible through it.
# - com.github.vertical-blank:sql-formatter — MIT. The Format button. Java
#   port of the sql-formatter JS library; zero dependencies, pure string
#   transform (no parsing of the session, no I/O), a few KB. Low release
#   cadence (2.0.5, 2024) is acceptable for a formatter whose input language
#   is stable; worst failure mode is ugly formatting of text the read-only
#   filter still checks afterwards.

[versions]
aircompressor = "2.0.3"
assertj = "3.27.3"
autocomplete = "3.3.3"
flatlaf = "3.7.2"
gson = "2.14.0"
grpc = "1.83.1"
jmh = "1.37"
junit = "6.1.3"
logback = "1.6.3"
protobuf = "4.36.0"
rsyntaxtextarea = "3.6.1"
slf4j = "2.0.18"
sql-formatter = "2.0.5"
sqlite-jdbc = "3.53.2.1"

[libraries]
aircompressor = { module = "io.airlift:aircompressor", version.ref = "aircompressor" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
autocomplete = { module = "com.fifesoft:autocomplete", version.ref = "autocomplete" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
rsyntaxtextarea = { module = "com.fifesoft:rsyntaxtextarea", version.ref = "rsyntaxtextarea" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
sql-formatter = { module = "com.github.vertical-blank:sql-formatter", version.ref = "sql-formatter" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
jmh = { id = "me.champeau.jmh", version = "0.7.3" }
protobuf = { id = "com.google.protobuf", version = "0.10.0" }
